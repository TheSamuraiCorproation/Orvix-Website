# Netlify site config. The repo root is the publish folder. The only build
# work is the blog: tools/blog turns content/posts/*.json into article pages,
# then tools/seo adds their SEO head and refreshes the sitemap (and fails the
# deploy if any page breaks the SEO rules). Headers and redirects stay in
# _headers and _redirects.
[build]
  publish = "."
  command = "node --test \"netlify/functions/*.test.mjs\" && python -m tools.blog && python -m tools.seo build"

[build.environment]
  PYTHON_VERSION = "3.12"

# The blog admin API. No package.json: the function uses Node built-ins only.
[functions]
  directory = "netlify/functions"
  # Newsletter templates read by netlify/lib/newsletter.mjs when a post is
  # first published (Brevo draft campaigns).
  included_files = ["email/*.html"]

# Stop Netlify rewriting links and re-minifying on deploy; the export is
# already final and the links are already correct (see README.md, "URLs and links").
[build.processing]
  skip_processing = true
